[project]
name = "whatsapp-drive-archive"
version = "0.5.0"
description = "Google Drive content archives and bounded on-demand chat reads"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp==1.26.0",
    "google-api-python-client==2.193.0",
    "google-auth==2.49.1",
    "requests==2.32.4",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = ["ruff>=0.5"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
